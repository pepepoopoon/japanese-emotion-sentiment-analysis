[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "japanese-emotion-sentiment-analysis"
version = "0.1.0"
description = "Японская классификация полярности и мультилейбл-эмоций"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.3,<2",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
japanese-generate-smoke = "japanese_emotion_sentiment.demo_data:main"
japanese-train = "japanese_emotion_sentiment.train:main"
japanese-evaluate = "japanese_emotion_sentiment.evaluate:main"
japanese-predict = "japanese_emotion_sentiment.predict:main"

[tool.hatch.build.targets.wheel]
packages = ["src/japanese_emotion_sentiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
